
name: Avenix Trip Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: avenix-trip-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check article generator
        run: |
          echo "Repository is ready for the Avenix Trip article generator."
          echo "AI generation will be connected in the next setup step."

      - name: Build blog
        run: npm run build

      - name: Commit generated site files
        run: |
          git config user.name "Avenix Trip Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Automated Avenix Trip blog update"
          git push
